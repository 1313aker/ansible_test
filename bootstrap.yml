---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (centOS)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_facts.distribution == "CentOS"

- hosts: all
  become: true
  tasks:

  - name: create becca user
    tags: userAdd
    user:
      name: becca
      groups: root

  - name: add ssh key for becca
    tags: userAdd
    authorized_key:
      user: becca
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBIsufShe/g7rtrPxuNOvIotIfu/W4HYRye28+XLwd5o ansible"

  - name: add sudoers file for becca
    tags: userAdd
    copy:
      src: sudoer_becca
      dest: /etc/sudoers.d/becca
      owner: root
      group: root
      mode: 0440


- hosts: workstations
  become: true
  tasks:

  - name: install unzip
    package:
      name: unzip

  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/0.12.8/terraform_0.12.8_windows_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root


- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php packages for Ubuntu servers
    tags: apacheTag, phpTag
    apt: 
      name:
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
    when: ansible_facts.distribution in ["Ubuntu", "Debian"] # Not needed anymore

  - name: copy default html file for the site
    tags: apache, phpTag
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

  - name: start httpd
    tags: httpdService
    service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_facts.distribution in "Ubuntu"

  - name: change email address for admin
    tags: httpd
    lineinfile: 
      path: /etc/apache2/apache2.conf
      regexp: '^Timeout'
      line: Timeout 100
    when: ansible_facts.distribution in "Ubuntu"   
    register: httpdVar

  - name: restart httpd
    tags: httpd
    service:
      name: httpd
      state: restarted
    when: httpdVar.changed 

- hosts: fun_servers
  become: true
  tasks:
 
  - name: install oneko kitty
    tags: oneko
    apt:
      name:
        - oneko
      state: latest
      update_cache: yes
    when: ansible_facts.distribution in "Ubuntu" 
